<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人人际拓扑 · Personal Topology</title>
<style>
:root{--bg:#0e1116;--panel:#151a21;--panel2:#1c232c;--line:#2a333f;--text:#e6edf3;--muted:#8b98a5;--accent:#6ea8fe}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
#app{display:flex;height:100%}
#stage{flex:1;position:relative;min-width:0}
svg{width:100%;height:100%;display:block;cursor:grab}
svg.dragging{cursor:grabbing}
.elabel{font-size:11px;fill:var(--muted);pointer-events:none}
.nlabel{font-size:12px;fill:var(--text);pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.node{cursor:pointer}
#legend{position:absolute;left:14px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:70%}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);cursor:pointer;user-select:none}
.chip.on{color:var(--text);border-color:var(--accent)}
#badge{position:absolute;left:14px;top:12px;font-size:12px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;display:none}
#hint{position:absolute;right:14px;bottom:12px;font-size:12px;color:var(--muted)}
#panel{width:340px;flex:0 0 340px;border-left:1px solid var(--line);background:var(--panel);padding:18px 18px 28px;overflow:auto}
#panel h2{margin:0 0 4px;font-size:18px}
#panel .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
#panel dl{display:grid;grid-template-columns:76px 1fr;gap:6px 10px;margin:0 0 14px}
#panel dt{color:var(--muted);font-size:12px}
#panel dd{margin:0;font-size:13px;word-break:break-word}
#panel .facts{font-size:13px;color:#cfd8e3}
#panel .empty{color:var(--muted);font-size:13px}
#panel button{margin-top:14px;width:100%;padding:8px;border-radius:8px;cursor:pointer;background:var(--accent);border:0;color:#0b1220;font-weight:600}
#panel .meta{color:var(--muted);font-size:11px;margin-top:14px;line-height:1.5}
@media (max-width:760px){#panel{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <svg id="svg" viewBox="0 0 1120 960" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="badge"></div>
    <div id="legend"></div>
    <div id="hint">滚轮缩放 · 拖拽平移 · 单击看档案 · 双击设为中心</div>
  </div>
  <aside id="panel">
    <h2 id="p-name">我</h2>
    <div class="sub" id="p-sub">中心节点</div>
    <div id="p-body"></div>
  </aside>
</div>
<script>
const DATA = window.__TOPOLOGY_DATA__ || {self:{name:"我",fields:[]},stages:[],people:[],peer_edges:[],circles:[]};
const SELF = DATA.self || {name:"我",fields:[]};
const STAGES = DATA.stages || [];
const PEOPLE = (DATA.people || []).filter(p => p.name !== SELF.name);
const EDGES = DATA.peer_edges || [];
const CIRCLES = DATA.circles || [];
const CX = 560, CY = 480, W = 1120, H = 960;

const stageOf = id => STAGES.find(s => s.id === id) || {id, label: id || "未分阶段", color: "#8b98a5"};
const stageColor = p => stageOf(p.stage).color;
const circleOf = p => CIRCLES.find(c => (c.members || []).includes(p.name));
const neighbors = n => new Set(EDGES.filter(e => e.a === n || e.b === n).flatMap(e => [e.a, e.b]));
const sizeFor = p => 9 + Math.min((p.count || 0) * 1.6, 8);
const relTier = r => /亲密|前任|situationship|追求|恋人/i.test(r || "") ? 152
                    : /职业|mentor|同事|招聘|实习/i.test(r || "") ? 300 : 232;

let root = SELF.name, filterStage = null, selected = null;
let nodeEls = new Map(), edgeEls = [], lastPos = new Map(), tweenRAF = null;
const view = {x: 0, y: 0, w: W, h: H};
const svg = document.getElementById("svg");
const $ = id => document.getElementById(id);

function visible() { return filterStage ? PEOPLE.filter(p => p.stage === filterStage) : PEOPLE.slice(); }

function radiusFor(p) {
  const base = relTier(p.relation);
  if (base !== 232) return base;
  const c = circleOf(p);
  const d = neighbors(p.name).size + (c ? c.members.length - 1 : 0);
  const jitter = [...p.name].reduce((a, ch) => a + ch.charCodeAt(0), 0) % 3;
  return d >= 8 ? 168 + jitter * 22 : d >= 4 ? 232 + jitter * 16 : 276 + jitter * 18;
}

function layout() {
  const list = visible();
  const groups = STAGES.map(s => ({s, ps: list.filter(p => p.stage === s.id)})).filter(g => g.ps.length);
  const total = list.length || 1;
  let a0 = -Math.PI / 2;
  const pos = new Map([[root, {x: CX, y: CY}]]);
  for (const g of groups) {
    const span = Math.PI * 2 * (g.ps.length / total);
    const arr = g.ps.slice().filter(p => p.name !== root).sort((a, b) =>
      (circleOf(a) ? 0 : 1) - (circleOf(b) ? 0 : 1) || radiusFor(a) - radiusFor(b) || a.name.localeCompare(b.name));
    arr.forEach((p, i) => {
      const ang = a0 + span * (i + 0.5) / arr.length;
      const r = radiusFor(p);
      pos.set(p.name, {x: CX + Math.cos(ang) * r, y: CY + Math.sin(ang) * r});
    });
    a0 += span;
  }
  const keys = [...pos.keys()];
  for (let it = 0; it < 4; it++) {
    for (let i = 0; i < keys.length; i++) for (let j = i + 1; j < keys.length; j++) {
      const A = pos.get(keys[i]), B = pos.get(keys[j]);
      if (!A || !B) continue;
      const dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy) || 1, min = 68;
      if (d < min) { const push = (min - d) / 2 / d; A.x -= dx * push; A.y -= dy * push; B.x += dx * push; B.y += dy * push; }
    }
  }
  for (const v of pos.values()) {
    v.x = Math.max(40, Math.min(W - 40, v.x));
    v.y = Math.max(40, Math.min(H - 40, v.y));
  }
  return pos;
}

function el(tag, attrs = {}) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function startTween(moves) {
  cancelAnimationFrame(tweenRAF);
  if (!moves.length) return;
  const t0 = performance.now(), dur = 600;
  const step = t => {
    const k = Math.min(1, (t - t0) / dur);
    const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    for (const m of moves) for (const kk in m.to)
      m.el.setAttribute(kk, (+m.from[kk] + (+m.to[kk] - +m.from[kk]) * e).toFixed(2));
    if (k < 1) tweenRAF = requestAnimationFrame(step);
  };
  tweenRAF = requestAnimationFrame(step);
}

function render() {
  svg.innerHTML = "";
  nodeEls.clear(); edgeEls = [];
  const pos = layout();
  const start = lastPos.size === pos.size ? lastPos : new Map([...pos.keys()].map(k => [k, {x: CX, y: CY}]));
  const moves = [];
  const place = (node, fromAttrs, toAttrs) => {
    for (const k in fromAttrs) node.setAttribute(k, fromAttrs[k]);
    moves.push({el: node, from: fromAttrs, to: toAttrs});
    return node;
  };

  const gLinks = el("g"), gPeers = el("g"), gNodes = el("g");
  svg.append(gLinks, gPeers, gNodes);

  const selfPos = pos.get(root) || {x: CX, y: CY};
  const targets = visible();

  for (const p of targets) {
    if (p.name === root) continue;
    const a = start.get(root) || selfPos, b = start.get(p.name) || pos.get(p.name);
    const A = selfPos, B = pos.get(p.name);
    const line = el("line", {stroke: stageColor(p), "stroke-opacity": .35,
      "stroke-width": 1.1, "stroke-dasharray": relTier(p.relation) === 300 ? "4 4" : ""});
    gLinks.appendChild(place(line, {x1: a.x, y1: a.y, x2: b.x, y2: b.y}, {x1: A.x, y1: A.y, x2: B.x, y2: B.y}));
    if (p.relation) {
      const t = el("text", {class: "elabel", "text-anchor": "middle"});
      t.textContent = p.relation;
      gLinks.appendChild(place(t, {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 - 4}, {x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 - 4}));
    }
  }

  for (const e of EDGES) {
    const A = pos.get(e.a), B = pos.get(e.b);
    if (!A || !B) continue;
    const a = start.get(e.a) || A, b = start.get(e.b) || B;
    const line = el("line", {stroke: "#5b6b7f", "stroke-opacity": .45, "stroke-width": 1});
    gPeers.appendChild(place(line, {x1: a.x, y1: a.y, x2: b.x, y2: b.y}, {x1: A.x, y1: A.y, x2: B.x, y2: B.y}));
    if (e.label) {
      const t = el("text", {class: "elabel", "text-anchor": "middle"});
      t.textContent = e.label;
      gPeers.appendChild(place(t, {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 + 10}, {x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 + 10}));
    }
  }

  const selfG = el("g", {class: "node", "data-name": root});
  const sc = root === SELF.name ? "#e8eef6" : stageColor(PEOPLE.find(p => p.name === root) || {});
  const sc0 = start.get(root) || selfPos;
  selfG.appendChild(place(el("circle", {r: 17, fill: "#0e1116", stroke: sc, "stroke-width": 2.5}),
    {cx: sc0.x, cy: sc0.y}, {cx: selfPos.x, cy: selfPos.y}));
  const sl = el("text", {"text-anchor": "middle", "font-size": 11, fill: sc});
  sl.textContent = root.length > 2 ? root.slice(0, 2) : root;
  selfG.appendChild(place(sl, {x: sc0.x, y: sc0.y + 4}, {x: selfPos.x, y: selfPos.y + 4}));
  selfG.addEventListener("click", ev => { ev.stopPropagation(); select(root); });
  selfG.addEventListener("dblclick", ev => { ev.stopPropagation(); setRoot(SELF.name); });
  gNodes.appendChild(selfG); nodeEls.set(root, selfG);

  for (const p of targets) {
    const P = pos.get(p.name), S = start.get(p.name) || P;
    const g = el("g", {class: "node", "data-name": p.name});
    g.appendChild(place(el("circle", {r: sizeFor(p), fill: stageColor(p), "fill-opacity": .85, stroke: "#0e1116", "stroke-width": 1.5}),
      {cx: S.x, cy: S.y}, {cx: P.x, cy: P.y}));
    const lab = el("text", {class: "nlabel", "text-anchor": "middle"});
    lab.textContent = p.name;
    g.appendChild(place(lab, {x: S.x, y: S.y + sizeFor(p) + 13}, {x: P.x, y: P.y + sizeFor(p) + 13}));
    g.addEventListener("click", ev => { ev.stopPropagation(); select(p.name); });
    g.addEventListener("dblclick", ev => { ev.stopPropagation(); setRoot(p.name); });
    g.addEventListener("mouseenter", () => highlight(p.name));
    g.addEventListener("mouseleave", () => highlight(null));
    gNodes.appendChild(g); nodeEls.set(p.name, g);
  }

  lastPos = new Map([...pos].map(([k, v]) => [k, {x: v.x, y: v.y}]));
  startTween(moves);
  renderLegend(); applyView(); applyFocus();
}

function setRoot(n) {
  root = n; filterStage = null;
  const p = PEOPLE.find(x => x.name === n);
  $("badge").style.display = n === SELF.name ? "none" : "block";
  $("badge").textContent = n === SELF.name ? "" : "视角：" + n + "（双击空白处或点「回到我」）";
  lastPos.clear();
  render();
  select(n);
}

function applyFocus() {
  const near = new Set([root, ...neighbors(root)]);
  nodeEls.forEach((g, n) => { g.style.opacity = near.has(n) ? 1 : .35; });
}

function highlight(n) {
  if (!n) {
    nodeEls.forEach(g => { g.style.opacity = 1; });
    $("badge").style.display = root === SELF.name ? "none" : "block";
    if (root !== SELF.name) $("badge").textContent = "视角：" + root;
    return;
  }
  const near = new Set([n, ...neighbors(n)]);
  nodeEls.forEach((g, k) => { g.style.opacity = near.has(k) ? 1 : .18; });
  const c = circleOf(PEOPLE.find(p => p.name === n) || {});
  if (c) { $("badge").style.display = "block"; $("badge").textContent = `${c.label} · ${c.members.length} 人`; }
}

function select(n) {
  selected = n;
  const p = n === SELF.name ? Object.assign({}, SELF, {isSelf: true}) : PEOPLE.find(x => x.name === n);
  if (!p) return;
  $("p-name").textContent = p.name || "我";
  $("p-sub").textContent = n === SELF.name ? "中心节点" : `${stageOf(p.stage).label}${p.relation ? " · " + p.relation : ""}`;
  const rows = [["阶段", stageOf(p.stage).label], ["关系", p.relation || "—"], ["出现", (p.count || 0) + " 次"],
                ["圈子", (circleOf(p) || {}).label || "—"], ["标签", (p.tags || []).join("、") || "—"]];
  const facts = (p.facts || []).map(f => `<li>${f}</li>`).join("") ||
    '<div class="empty">暂无口述记录。按 SPEC 的口述规则补一条。</div>';
  const fields = (p.fields || []).map(f => `<dt>${f.label}</dt><dd>${f.value}</dd>`).join("");
  $("p-body").innerHTML = `<dl>${rows.map(r => `<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join("")}${fields}</dl>
    <div class="facts"><ul style="padding-left:16px;margin:0">${facts}</ul></div>
    ${p.file ? `<div class="meta">档案：${p.file}</div>` : ""}
    ${n !== SELF.name ? `<button id="focus-btn">以「${p.name}」为中心重新排布</button>` : ""}`;
  const b = $("focus-btn"); if (b) b.onclick = () => setRoot(n);
}

function renderLegend() {
  const box = $("legend"); box.innerHTML = "";
  const all = document.createElement("div");
  all.className = "chip" + (filterStage ? "" : " on");
  all.textContent = "全部";
  all.onclick = () => { filterStage = null; render(); };
  box.appendChild(all);
  for (const s of STAGES) {
    const n = PEOPLE.filter(p => p.stage === s.id).length;
    if (!n) continue;
    const c = document.createElement("div");
    c.className = "chip" + (filterStage === s.id ? " on" : "");
    c.innerHTML = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.color};margin-right:5px"></span>${s.label} ${n}`;
    c.onclick = () => { filterStage = filterStage === s.id ? null : s.id; render(); };
    box.appendChild(c);
  }
}

function applyView() { svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`); }

svg.addEventListener("wheel", e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = view.x + (e.clientX - r.left) / r.width * view.w;
  const my = view.y + (e.clientY - r.top) / r.height * view.h;
  const k = e.deltaY > 0 ? 1.12 : 0.89;
  const nw = Math.min(W * 1.6, Math.max(280, view.w * k)), nh = nw * H / W;
  view.x = mx - (mx - view.x) * (nw / view.w);
  view.y = my - (my - view.y) * (nh / view.h);
  view.w = nw; view.h = nh;
  applyView();
}, {passive: false});

let drag = null;
svg.addEventListener("pointerdown", e => {
  if (e.target.closest(".node")) return;
  drag = {x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false};
  svg.classList.add("dragging");
});
svg.addEventListener("pointermove", e => {
  if (!drag) return;
  const r = svg.getBoundingClientRect();
  const dx = (e.clientX - drag.x) / r.width * view.w, dy = (e.clientY - drag.y) / r.height * view.h;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 3) drag.moved = true;
  view.x = drag.vx - dx; view.y = drag.vy - dy; applyView();
});
svg.addEventListener("pointerup", () => { svg.classList.remove("dragging"); drag = null; });
svg.addEventListener("click", e => {
  if (drag && drag.moved) { drag = null; return; }
  if (!e.target.closest(".node")) setRoot(SELF.name);
});

render(); select(SELF.name);
</script>
</body>
</html>
